name: "Update flake.lock"

on:
  schedule:
    - cron: '0 4 * * 5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    uses: akirak/akirak/.github/workflows/update-flake.yml@master

    permissions:
      contents: write
      pull-requests: write

    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
